<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-STREAM // PRO MOVIE ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --primary-neon: #00ff88;
            --secondary-neon: #00e5ff;
            --accent-purple: #9d00ff;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-glow: rgba(0, 255, 136, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(157, 0, 255, 0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 229, 255, 0.1), transparent 40%),
                linear-gradient(to bottom, rgba(3, 7, 18, 0.9), rgba(3, 7, 18, 0.95)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 136, 0.02) 2px, rgba(0, 255, 136, 0.02) 4px);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* Galaxy Grid Line Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Search Bar Cyber-Style */
        .search-box {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 12px 16px;
            color: var(--primary-neon);
            font-size: 1.2rem;
            font-weight: 600;
        }

        input::placeholder {
            color: var(--text-dim);
            font-weight: 400;
        }

        button {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }

        /* Movie Display Card */
        .movie-card {
            display: none;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            background: var(--card-bg);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 255, 136, 0.05);
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poster-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .movie-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .meta-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .plot {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: rgba(3, 7, 18, 0.6);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-item {
            font-size: 0.95rem;
        }

        .detail-item strong {
            color: var(--secondary-neon);
        }

        .status-msg {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-neon);
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .movie-card {
                grid-template-columns: 1fr;
            }
            .poster-container {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AJMEER KHAN HACKER KING Movie DB</h1>
            <div class="subtitle">SYSTEM STATUS: ONLINE // API CONNECTED</div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter movie title (e.g., Avengers, Avatar)...">
            <button onclick="searchMovie()">SEARCH</button>
        </div>

        <div id="status" class="status-msg"></div>

        <div id="movieCard" class="movie-card">
            <div class="poster-container">
                <img id="poster" src="" alt="Movie Poster">
            </div>
            <div class="movie-info">
                <div>
                    <h2 id="title" class="movie-title"></h2>
                    <div class="meta-tags">
                        <span id="rating" class="tag"></span>
                        <span id="year" class="tag"></span>
                        <span id="runtime" class="tag"></span>
                    </div>
                    <p id="plot" class="plot"></p>
                </div>
                <div class="details-grid">
                    <div class="detail-item"><strong>Genre:</strong> <span id="genre"></span></div>
                    <div class="detail-item"><strong>Director:</strong> <span id="director"></span></div>
                    <div class="detail-item"><strong>Actors:</strong> <span id="actors"></span></div>
                    <div class="detail-item"><strong>Language:</strong> <span id="language"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '4376773a'; // Embedded OMDb API Key

        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            const statusDiv = document.getElementById('status');
            const movieCard = document.getElementById('movieCard');

            if (!query) {
                statusDiv.innerText = "PLEASE ENTER A MOVIE TITLE.";
                return;
            }

            statusDiv.innerText = "ACCESSING DATABASE...";
            movieCard.style.display = "none";

            try {
                const response = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(query)}&apikey=${API_KEY}`);
                const data = await response.json();

                if (data.Response === "True") {
                    statusDiv.innerText = "";
                    
                    document.getElementById('poster').src = data.Poster !== "N/A" ? data.Poster : 'https://via.placeholder.com/300x450/0f172a/00ff88?text=NO+POSTER';
                    document.getElementById('title').innerText = data.Title;
                    document.getElementById('rating').innerText = `IMDb: ${data.imdbRating}`;
                    document.getElementById('year').innerText = data.Year;
                    document.getElementById('runtime').innerText = data.Runtime;
                    document.getElementById('plot').innerText = data.Plot;
                    document.getElementById('genre').innerText = data.Genre;
                    document.getElementById('director').innerText = data.Director;
                    document.getElementById('actors').innerText = data.Actors;
                    document.getElementById('language').innerText = data.Language;

                    movieCard.style.display = "grid";
                } else {
                    statusDiv.innerText = `ERROR: ${data.Error.toUpperCase()}`;
                }
            } catch (err) {
                statusDiv.innerText = "CONNECTION FAILED. TRY AGAIN.";
                console.error(err);
            }
        }

        // Allow 'Enter' key press to search
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchMovie();
            }
        });
    </script>
</body>
</html>
